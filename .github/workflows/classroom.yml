name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  tests:
    name: Autograding & Project Tests
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      DJANGO_SECRET_KEY: "test-secret"
      MODE: "local"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_NAME: "test-db"
      DB_USER: "test-user"
      DB_PASSWORD: "test-password"
      DB_DOCKER_HOST: "test-host"
      DB_LOCAL_HOST: "test-host"
      DB_PORT: "test-port"
      LOG_DIR: "/var/log/person-service"
      DJANGO_LOG_LEVEL: "INFO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  build_image:
    name: Build & Push Docker image
    needs: [ tests ]
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
            
  deploy:
    name: Deploy to production server
    needs: [build_image]
    runs-on: ubuntu-latest

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.event.workflow_run.head_sha }}
      SERVICE_URL: ${{ secrets.SERVICE_BASE_URL }}
      REMOTE_DIR: /opt/${{ github.event.repository.name }}

    steps:
      - name: Checkout #
        uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.sh,docker-compose.prod.yml"
          target: "${{ env.REMOTE_DIR }}"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE
          script: |
            set -euo pipefail
            echo "Deploying $IMAGE"
            bash ${{ env.REMOTE_DIR }}/deploy.sh "$IMAGE" ${{ env.REMOTE_DIR }}

      - name: Run prod API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true